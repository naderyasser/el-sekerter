name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: الاختبارات
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test secretary

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: بناء APK
        working-directory: app
        # غيّر العنوان لسيرفرك قبل ما توزّع النسخة.
        env:
          # ظبّط API_BASE_URL في Settings → Secrets and variables → Actions
          # → Variables. من غيره الـAPK يطلع بعنوان فاضي ولازم تحطه من
          # شاشة الإعدادات في التطبيق.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${API_BASE_URL:-http://10.0.2.2:8000}"
      - uses: actions/upload-artifact@v4
        with:
          name: sekerter-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    needs: app
    # ماك مطلوب لبناء iOS. بدون شهادات المخرج غير موقّع — بيتحقق إن المشروع
    # بيتبني، ومينفعش يتثبّت على جهاز. للتثبيت لازم اشتراك Apple Developer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: بناء iOS (بدون توقيع)
        working-directory: app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="${API_BASE_URL:-http://10.0.2.2:8000}"
