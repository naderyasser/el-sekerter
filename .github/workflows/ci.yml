name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: الاختبارات
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test secretary

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android:
    needs: app
    runs-on: ubuntu-latest
    # مطلوب عشان الخطوة الأخيرة تنشر الـAPK في إصدار.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # التاريخ كامل عشان rev-list --count يدي رقم نسخة تصاعدي.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: بناء APK
        working-directory: app
        env:
          # الافتراضي سيرفر الإنتاج. لو عايز تبني لسيرفر تاني ظبّط
          # API_BASE_URL في Settings → Secrets and variables → Actions
          # → Variables. (الافتراضي القديم كان عنوان المحاكي 10.0.2.2 —
          # وده كان ينشر نسخة رسمية موصولة على لا مكان.)
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --build-number=$(git rev-list --count HEAD) \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://el-sekerter.meena-alaqariya.com}"
      # الـAPK بينشر كإصدار مش كـartifact. سببين:
      #   • تخزين الـartifacts له حصة على مستوى الحساب، ولما تتملى البناء
      #     ينجح والرفع يقع — وده اللي حصل فعلًا.
      #   • الإصدار بيدي رابط تحميل ثابت ينفع يتبعت على الواتس على طول،
      #     بينما الartifact لازم تنزّله من صفحة البناء وبيجي في ZIP.
      - name: نشر الـAPK
        if: github.ref == 'refs/heads/master'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk sekerter.apk

          # وسم ثابت عشان الرابط ما يتغيّرش كل بناء.
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk sekerter.apk --clobber
          else
            gh release create apk sekerter.apk \
              --title "السكرتير الخاص — آخر نسخة" \
              --notes "بناء تلقائي. حمّل sekerter.apk وثبّته."
          fi

          gh release edit apk \
            --notes "بناء تلقائي من الكوميت ${GITHUB_SHA}."

  ios:
    needs: app
    # يدوي بس. دقيقة الماك بتتحسب ١٠ أضعاف دقيقة اللينكس عند GitHub، وتشغيلها
    # مع كل دفعة هو اللي فضّى حصة الأكشنز في يومين ووقّف كل البناءات. لو عايز
    # تتأكد إن iOS لسه بيتبني، شغّل الـworkflow يدوي من تبويب Actions.
    if: github.event_name == 'workflow_dispatch'
    # ماك مطلوب لبناء iOS. بدون شهادات المخرج غير موقّع — بيتحقق إن المشروع
    # بيتبني، ومينفعش يتثبّت على جهاز. للتثبيت لازم اشتراك Apple Developer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: بناء iOS (بدون توقيع)
        working-directory: app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://el-sekerter.meena-alaqariya.com}"
