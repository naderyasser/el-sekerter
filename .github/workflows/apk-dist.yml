name: بناء APK ودفعه في dist

# بيئة Claude Code البعيدة محجوبة عن dl.google.com، فمفيش طريقة تنزّل بيها
# Android SDK محليًا. الرَنَر بتاع GitHub عنده الـSDK وشبكة مفتوحة، فالبناء
# بيتم هنا والناتج بيترجع للريبو في dist/ على نفس الفرع.

on:
  workflow_dispatch:
  push:
    branches: [apk-dist]
    # من غير paths-ignore عشان كوميت فاضي يقدر يعيد التشغيل. اللوب مقفول
    # من ناحيتين: كوميت الرَنَر فيه [skip ci]، وGitHub أصلًا ما بيعيدش
    # تشغيل الworkflows على دفعات بتوكن GITHUB_TOKEN.

concurrency:
  group: apk-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk-dist
          # التاريخ كامل عشان rev-list --count يدي رقم نسخة تصاعدي حقيقي.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: نسخ الأدوات
        run: |
          flutter --version
          java -version

      - name: تنزيل الحزم
        working-directory: app
        run: flutter pub get

      - name: الاختبارات
        working-directory: app
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/test-output.txt"
          # الgate الأساسي: لو أي اختبار فشل، flutter test نفسه بيرجع كود
          # غير صفر وpipefail بيوقّف الخطوة هنا.
          flutter test 2>&1 | tee "$out"

          # العدّ ثانوي للتوثيق. flutter بيطبع بصيغتين حسب وجود TTY:
          #   من غير TTY (زي هنا): "🎉 77 tests passed."
          #   مع TTY (محليًا):      "00:05 +77: All tests passed!"
          # لازم || true على كل grep — من غير كده أول grep مايلاقيش بيرجع
          # كود 1 وbash -e بتاع GitHub بيقتل الخطوة قبل أي تحقق.
          passed=$(grep -oE '[0-9]+ tests? passed' "$out" \
            | grep -oE '^[0-9]+' | tail -1 || true)
          if [ -z "$passed" ]; then
            passed=$(grep -oE '\+[0-9]+' "$out" | tr -d '+' \
              | sort -n | tail -1 || true)
          fi
          passed=${passed:-0}

          echo "عدد الاختبارات الناجحة: $passed"
          echo "TESTS_PASSED=$passed" >> "$GITHUB_ENV"
          if [ "$passed" -lt 90 ]; then
            echo "::error::المتوقع 90 اختبار على الأقل، الناجح $passed"
            exit 1
          fi

      - name: مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # مفتاح ثابت من أسرار الريبو — من غيره كل بيلد يطلع بتوقيع مختلف
          # وأندرويد يرفض التحديث فوق المثبّت بصمت (حصل فعلًا).
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::السر ANDROID_KEYSTORE_B64 مش متظبط. من صفحة الريبو:"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          # ‎-di بيتجاهل أي حروف مش من أبجدية base64 — اللصق من ويندوز
          # بيدخّل \r وبيوقّع الفك الصارم بـ"invalid input" (حصل فعلًا).
          printf '%s' "$KEYSTORE_B64" | base64 -di > app/android/app/sekerter-release.jks
          # تحقق إن الناتج مفتاح صالح فعلًا — لو اللصق كان ناقص نفشل
          # برسالة واضحة بدل ما نوقّع في وسط البناء.
          if ! keytool -list -keystore app/android/app/sekerter-release.jks \
              -storepass sekerter2026 -alias sekerter >/dev/null 2>&1; then
            echo "::error::محتوى السر مش مفتاح صالح — غالبًا النسخ كان ناقص."
            echo "::error::احذف السر وأعد إضافته: افتح ANDROID_KEYSTORE_B64.txt وانسخ محتواه كاملًا (Ctrl+A ثم Ctrl+C) والصقه."
            exit 1
          fi

      - name: بناء APK
        working-directory: app
        run: |
          # رقم النسخة = عدد الكوميتات: تصاعدي دايمًا وموحّد بين الـworkflows،
          # فأندرويد يقبل كل تحديث فوق اللي قبله.
          flutter build apk --release \
            --build-number=$(git rev-list --count HEAD) \
            --dart-define=API_BASE_URL=https://el-sekerter.meena-alaqariya.com

      - name: تفعيل KVM للمحاكي
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: تدخين النسخة النهائية على أندرويد حقيقي
        # كل الاختبارات التانية بتشتغل على نسخة debug — دي بتثبّت **نفس
        # الملف اللي هيتنشر** (release مضغوطة وبالتوقيع الحقيقي) على محاكي،
        # وتشغّلها، وتتأكد إنها عايشة من غير أي انهيار، وتاخد لها صورة.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: app
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.elsekerter.sekerter/.MainActivity
            sleep 25
            pid=$(adb shell pidof com.elsekerter.sekerter || true)
            if [ -z "$pid" ]; then
              echo "::error::النسخة النهائية وقعت عند الإقلاع — مش هتتنشر"
              adb logcat -d | grep -iE "FATAL|AndroidRuntime" | tail -50
              exit 1
            fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::انهيار في اللوج رغم إن العملية عايشة"
              adb logcat -d | grep -A25 "FATAL EXCEPTION" | tail -60
              exit 1
            fi
            adb exec-out screencap -p > release-boot.png
            echo "النسخة النهائية فتحت وعايشة (pid=$pid) ✅"

      - name: تجهيز dist
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/sekerter.apk
          # صورة أول إقلاع للنسخة دي نفسها على أندرويد — دليل مرئي إنها شغالة.
          cp app/release-boot.png dist/screenshot.png
          ( cd dist && sha256sum sekerter.apk > sekerter.apk.sha256 )

          sha=$(cut -d' ' -f1 dist/sekerter.apk.sha256)
          size=$(du -h dist/sekerter.apk | cut -f1)
          built_at=$(date -u '+%Y-%m-%d %H:%M UTC')

          rm -f dist/BUILD_FAILED.md

          cat > dist/README.md <<EOF
          # السكرتير الخاص — نسخة أندرويد

          نزّل sekerter.apk وابعته على الواتس.

          | | |
          |---|---|
          | تاريخ البناء | ${built_at} |
          | الكوميت | \`${GITHUB_SHA}\` |
          | SHA256 | \`${sha}\` |
          | الحجم | ${size} |
          | الاختبارات | ${TESTS_PASSED}/${TESTS_PASSED} ناجحة |
          | عنوان السيرفر | https://el-sekerter.meena-alaqariya.com |

          ## التثبيت

          1. نزّل \`sekerter.apk\` على الموبايل.
          2. لو ظهرت رسالة «مصادر غير معروفة»، اسمح للمتصفح أو لتطبيق الملفات
             بتثبيت التطبيقات، وبعدين كمّل.
          3. افتح التطبيق — هيكون موصول على السيرفر على طول.

          ## صورة النسخة دي وهي شغالة

          \![أول إقلاع على أندرويد](screenshot.png)

          ## التحقق من الملف

          \`\`\`
          sha256sum -c sekerter.apk.sha256
          \`\`\`

          ## ملاحظات

          - النسخة موقّعة بمفتاح ثابت (من أسرار الريبو، مش متكوميت)،
            فأي تحديث جديد بيتثبّت فوق القديم عادي من غير مسح.
            **استثناء لمرة واحدة:** اللي مثبّت نسخة من قبل 2026-08-16 لازم
            يمسحها ويثبّت من جديد — النسخ القديمة كانت بتتوقع بمفتاح متغيّر
            وأندرويد بيرفض التحديث فوقها بصمت.
          - البناء بيتعمل أوتوماتيك من \`.github/workflows/apk-dist.yml\` مع كل
            دفعة على فرع \`apk-dist\`.
          EOF

          echo "SHA256=${sha}" >> "$GITHUB_ENV"

      - name: دفع الناتج
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "مفيش تغيير في dist"
            exit 0
          fi
          git commit -m "بناء APK من ${GITHUB_SHA::7} [skip ci]

          الاختبارات: ${TESTS_PASSED} ناجحة
          SHA256: ${SHA256}"
          git push origin HEAD:apk-dist
