name: ديب تست — كل حاجة، وعلى أندرويد حقيقي

# اختبارات test/ بتستبدل نظام التشغيل بمسجّلات — كافية لكل حاجة ما عدا
# السؤال الجوهري: أندرويد نفسه بيقبل الجدولة وبيطلّع الإشعار؟ الوظيفة
# التالتة هنا بتشغّل التطبيق على محاكي أندرويد حقيقي وبتسأل النظام نفسه.

on:
  workflow_dispatch:
  push:
    branches: [apk-dist]
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/deep-test.yml'

concurrency:
  group: deep-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: اختبارات السيرفر (116)
        working-directory: backend
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test secretary

  app-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --set-exit-if-changed lib test integration_test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - name: اختبارات الوحدات (90)
        run: flutter test
        working-directory: app

  on-device:
    # المحاكي بياخد وقت — بس ده الاختبار الوحيد اللي بيسأل أندرويد نفسه.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: تفعيل KVM للمحاكي
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - name: اختبارات على أندرويد حقيقي
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # أندرويد ١٢ (API 32) عن قصد: قبل إذن POST_NOTIFICATIONS بتاع
          # ١٣+، فمافيش حوار نظام محتاج ضغطة بشرية، والإشعارات مسموحة
          # افتراضيًا — والجدولة الدقيقة موجودة من ١٢ فبنجرّب منعها.
          api-level: 32
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          working-directory: app
          script: |
            # الجولة الأولى — الملفين:
            #   on_device_test: طبقة النظام (القناة، الحجز، المتكرر،
            #     والإشعار بينزل فعلًا في وقته).
            #   app_flow_test: محاكاة مستخدم كامل — التطبيق بيتفتح،
            #     الإعداد الأول، الشات بيتكتب فيه فعلًا، كل ميزة تتدوس
            #     من الواجهة، وبعد كل خطوة بنسأل أندرويد نفسه.
            flutter test integration_test --dart-define=EXPECT_EXACT=true

            # الجولة التانية: نفس أزمة أجهزة شاومي وأمثالها — النظام مانع
            # «الجدولة الدقيقة». قبل التصليح ده كان بيمسح كل التذكيرات
            # ويجدول صفر، في صمت. بنتأكد من السقوط الآمن على نظام حقيقي.
            adb shell appops set com.elsekerter.sekerter SCHEDULE_EXACT_ALARM deny || true
            flutter test integration_test/on_device_test.dart --dart-define=EXPECT_EXACT=false
