name: sekerter
description: "السكرتير الخاص — شات بوت بيمسك مواعيدك ويفكّرك بيها."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة
  flutter_riverpod: ^2.6.1

  # الشبكة
  dio: ^5.11.0

  # التذكير المحلي — الجزء اللي بيخلّي التطبيق يشتغل من غير نت
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # التخزين المحلي
  sqflite: ^2.4.3
  path: ^1.9.1
  flutter_secure_storage: ^11.0.0

  # الصوت والأذونات
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.1

  # تنسيق التواريخ بالعربي
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
