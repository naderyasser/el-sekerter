name: sekerter
description: "السكرتير الخاص — شات بوت بيمسك مواعيدك ويفكّرك بيها."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة
  flutter_riverpod: ^2.6.1

  # الشبكة
  dio: ^5.11.0

  # التذكير المحلي — الجزء اللي بيخلّي التطبيق يشتغل من غير نت
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # التخزين المحلي
  sqflite: ^2.4.3
  path: ^1.9.1
  flutter_secure_storage: ^11.0.0

  # الصوت والأذونات
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.1

  # تنسيق التواريخ بالعربي
  intl: ^0.20.3
  flutter_contacts: ^2.3.1
  url_launcher: ^6.3.2
  android_intent_plus: ^6.1.0

  # عرض رقم النسخة في الإعدادات — عشان نعرف المستخدم على أنهي بيلد
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  # اختبارات بتتنفذ على جهاز/محاكي أندرويد حقيقي — الجدولة والإشعارات
  # عند نظام التشغيل نفسه، مش عند بديل مسجّل. بتتشغل في deep-test.yml.
  integration_test:
    sdk: flutter
  # توليد أيقونات المشغّل بكل الكثافات + الشكل التكيفي من أصل واحد.
  # الأصل بيتولد من scripts في assets/logo — شغّل بعد أي تغيير فيه:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/icon.png
  adaptive_icon_background: assets/logo/icon_background.png
  adaptive_icon_foreground: assets/logo/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png

  # الخط الافتراضي بيعرض العربي ضعيف — المسافات بين الحروف مش مظبوطة
  # والأوزان محدودة. Almarai معمول للعربي أصلًا ومجرّب في الإنتاج.
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
